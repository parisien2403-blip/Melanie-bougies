<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mél'Antan, bougies gourmandes artisanales façonnées à la main par Mélanie.">
<meta name="theme-color" content="#5b3a27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Mél'Antan Bougies</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap">
<style>
/* Layout : salon d'époque — lambris de noyer en tête et pied de page, vitrine sur lin mauve, étiquettes laiton */
:root{
  --paper:#f1e9ea; --paper-2:#e4d6da; --card:#fbf6f5;
  --ink:#38231f; --ink-soft:#6d5452;
  --rose:#9a7398; --rose-deep:#6e4a74;
  --bottle:#5b3a27; --mustard:#b08d4a;
  --wood:#5b3a27; --wood-2:#4a2e1f; --wood-hi:#7a5038; --on-wood:#f3e6dc;
  --line:#d7c5c8; --shadow:rgba(60,30,40,.14);
  --ok:#4f7a4a; --warn:#b07a1f; --bad:#a3423a;
  --f-display:"Abril Fatface", "Playfair Display", Georgia, serif;
  --f-body:"Libre Baskerville", Georgia, "Times New Roman", serif;
  --f-tag:"Special Elite", "Courier New", monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#211a1e; --paper-2:#2b2227; --card:#30262b;
  --ink:#f0e4e3; --ink-soft:#c4b0b3;
  --rose:#c4a0c8; --rose-deep:#d6b6da;
  --bottle:#d9b28f; --mustard:#d8b46a;
  --wood:#3a2418; --wood-2:#2c1b12; --wood-hi:#563626; --on-wood:#f3e6dc;
  --line:#4a3a40; --shadow:rgba(0,0,0,.4);
  --ok:#8cc184; --warn:#e2b65a; --bad:#e58a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#211a1e; --paper-2:#2b2227; --card:#30262b;
  --ink:#f0e4e3; --ink-soft:#c4b0b3;
  --rose:#c4a0c8; --rose-deep:#d6b6da;
  --bottle:#d9b28f; --mustard:#d8b46a;
  --wood:#3a2418; --wood-2:#2c1b12; --wood-hi:#563626; --on-wood:#f3e6dc;
  --line:#4a3a40; --shadow:rgba(0,0,0,.4);
  --ok:#8cc184; --warn:#e2b65a; --bad:#e58a80; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-image:radial-gradient(var(--paper-2) 1px,transparent 1px);background-size:18px 18px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}

/* Bandeau démo */
.demo{background:var(--wood-2);color:var(--on-wood);font-family:var(--f-tag);font-size:12.5px;text-align:center;padding:6px 16px;letter-spacing:.03em}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;color:var(--on-wood);border-bottom:4px solid var(--mustard);
  background:repeating-linear-gradient(90deg,var(--wood) 0 118px,var(--wood-2) 118px 121px,var(--wood-hi) 121px 123px,var(--wood) 123px 240px),var(--wood);
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.25)}
.wood{background:repeating-linear-gradient(90deg,var(--wood) 0 118px,var(--wood-2) 118px 121px,var(--wood-hi) 121px 123px,var(--wood) 123px 240px),var(--wood);color:var(--on-wood)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;flex-direction:column;line-height:1;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.logo b{font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--on-wood);letter-spacing:.01em}
.logo small{font-family:var(--f-tag);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mustard);margin-top:4px}
nav.main{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.nbtn{background:none;color:var(--on-wood);border:1px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.nbtn:hover{border-color:var(--mustard)}
.nbtn.on{background:var(--on-wood);color:var(--wood-2)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--rose);color:#fff;font-size:11px;margin-left:6px;font-family:var(--f-tag);padding:0 5px}

/* Hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center;padding-block:40px 24px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,60px);line-height:1.02;margin:0 0 14px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--rose-deep)}
.hero p{max-width:52ch;color:var(--ink-soft);margin:0 0 18px}
.stamp{font-family:var(--f-tag);display:inline-block;border:2px solid var(--rose-deep);color:var(--rose-deep);padding:4px 10px;transform:rotate(-2deg);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.hero-art{padding:14px;border:4px solid var(--mustard);box-shadow:0 10px 24px var(--shadow);display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.hero-art img{width:100%;height:100%;object-fit:cover;display:block;border:2px solid var(--wood-2);aspect-ratio:1/1;max-width:100%}
.hero-art img:first-child{grid-row:span 2}

/* Filtres */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:10px 18px;border-top:1px dashed var(--line)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--rose-deep);color:var(--card);border-color:var(--rose-deep)}
.bar input{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-width:0;width:220px;max-width:100%}

/* Vitrine */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;padding-bottom:48px}
.prod{background:var(--card);border:1px solid var(--line);box-shadow:0 2px 0 var(--paper-2);display:flex;flex-direction:column;position:relative;transition:transform .2s}
.prod:hover{transform:translateY(-3px)}
.prod .pic{aspect-ratio:1/1;background:var(--paper-2);display:grid;place-items:center;border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden;max-width:100%}
.prod .pic img{width:100%;height:100%;object-fit:cover}
.prod .pic svg{width:72%;height:auto}
.prod .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;line-height:1.15}
.meta{font-size:12.5px;color:var(--ink-soft)}
.prod .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.tag{font-family:var(--f-tag);background:var(--paper);border:1px solid var(--line);padding:3px 10px 3px 14px;position:relative;font-size:16px;font-variant-numeric:tabular-nums}
.tag::before{content:"";position:absolute;left:5px;top:50%;width:5px;height:5px;border-radius:50%;background:var(--line);transform:translateY(-50%)}
.cat{position:absolute;top:10px;left:10px;font-family:var(--f-tag);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:var(--card);border:1px solid var(--line);padding:2px 8px}
.low{position:absolute;top:10px;right:10px;font-family:var(--f-tag);font-size:11px;background:var(--mustard);color:#2b1d10;padding:2px 8px}
.low.out{background:var(--bad);color:#fff}.low.ok{background:var(--ok);color:#fff}
.insp{position:absolute;left:8px;bottom:8px;font-family:var(--f-tag);font-size:10px;letter-spacing:.06em;background:rgba(40,25,20,.72);color:#f3e6dc;padding:2px 7px}
.prod .pic{position:relative}.prod.sold .pic img{filter:grayscale(.7) opacity(.75)}
.btn{border:0;background:var(--rose-deep);color:var(--card);padding:8px 16px;border-radius:2px;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--bottle);color:var(--paper)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Panneaux */
.panel{background:var(--card);border:1px solid var(--line);padding:22px;margin-bottom:22px}
h2.sec{font-family:var(--f-display);font-weight:400;font-size:32px;margin:28px 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.two>*{min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-soft)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--paper);padding:9px 11px;border-radius:2px;color:var(--ink);font-size:15px}
.form{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-size:13.5px;min-height:1em}
.hint{font-size:12.5px;color:var(--ink-soft)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px dashed var(--line);vertical-align:middle}
th{font-family:var(--f-tag);font-weight:400;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{font-family:var(--f-tag);font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.s-nouvelle{color:var(--rose-deep)} .s-preparation{color:var(--warn)} .s-prete{color:var(--bottle)} .s-livree{color:var(--ok)} .s-annulee{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{border:1px solid var(--line);background:var(--card);padding:14px}
.kpi span{font-family:var(--f-tag);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.kpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}

/* Tiroir panier & modale */
.veil{position:fixed;inset:0;background:rgba(30,18,12,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--paper);z-index:41;display:flex;flex-direction:column;border-left:3px double var(--line);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.drawer h2{font-family:var(--f-display);font-weight:400;margin:0 0 12px;font-size:28px}
.lines{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:10px}
.line .mini{width:56px;height:56px;background:var(--paper-2);display:grid;place-items:center;overflow:hidden}
.line .mini svg{width:80%}.line .mini img{width:100%;height:100%;object-fit:cover}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border:1px solid var(--line);background:var(--card);cursor:pointer;border-radius:2px}
.total{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:22px;padding-top:12px;border-top:3px double var(--line);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:41;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);border:1px solid var(--line);max-width:760px;width:100%;max-height:90%;overflow:auto;display:grid;grid-template-columns:1fr 1fr}
.modal .box>*{min-width:0}
.modal .pic{background:var(--paper-2);display:grid;place-items:center;aspect-ratio:1/1;max-width:100%}
.modal .pic svg{width:70%}.modal .pic img{width:100%;height:100%;object-fit:cover}
.modal .txt{padding:22px;display:flex;flex-direction:column;gap:10px}
.modal h3{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;line-height:1.1}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13.5px}
dl.spec dt{font-family:var(--f-tag);color:var(--ink-soft)}dl.spec dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;font-family:var(--f-tag);z-index:60;font-size:13.5px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
footer{border-top:4px solid var(--mustard);padding-block:22px;font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding-top:24px}
  .two,.modal .box{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .bar input{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

/* ---------- Actions ---------- */
function addToCart(id){const p=P(id);const l=DB.cart.find(x=>x.id===id);const cur=l?l.q:0;if(cur>=p.stock){toast("Stock atteint pour cette bougie");return}l?l.q++:DB.cart.push({id,q:1});save();renderNav();toast(`« ${p.nom} » ajoutée au panier`)}
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-nav],[data-open],[data-close],[data-filtre],[data-add],[data-q],[data-act],[data-atab],[data-stock],[data-edit],[data-askdel],[data-del],[data-scroll],#goHome");
 if(!t)return; const d=t.dataset;
 if(d.close!==undefined&&e.target!==t&&t.classList.contains("modal"))return;
 if(t.id==="goHome"){view="boutique";layer=null;render();scrollTo(0,0);return}
 if(d.nav){view=d.nav;err="";layer=null;render();scrollTo(0,0)}
 else if(d.open){layer=d.open;err="";renderLayer()}
 else if(d.close!==undefined){layer=null;editing=null;renderLayer()}
 else if(d.filtre){filtre=d.filtre;render();document.getElementById("vitrine").scrollIntoView({block:"start"})}
 else if(d.scroll){document.getElementById(d.scroll).scrollIntoView({behavior:"smooth"})}
 else if(d.add){addToCart(d.add);if(layer==="cart")renderLayer()}
 else if(d.q){const[id,s]=d.q.split(":");const l=DB.cart.find(x=>x.id===id);const p=P(id);l.q+=+s;if(l.q>p.stock)l.q=p.stock;if(l.q<=0)DB.cart=DB.cart.filter(x=>x!==l);save();renderNav();renderLayer()}
 else if(d.atab){adminTab=d.atab;pending=null;render()}
 else if(d.stock){const[id,s]=d.stock.split(":");const p=P(id);p.stock=Math.max(0,p.stock+ +s);save();render()}
 else if(d.edit){editing={...P(d.edit)};layer="edit";renderLayer()}
 else if(d.askdel){pending=d.askdel;render()}
 else if(d.del){DB.products=DB.products.filter(p=>p.id!==d.del);DB.cart=DB.cart.filter(l=>l.id!==d.del);pending=null;save();render();toast("Création retirée de la vitrine")}
 else if(d.act==="cancelDel"){pending=null;render()}
 else if(d.act==="newProd"){editing={c1:"#e9a7b4",c2:"#c2405a"};layer="edit";renderLayer()}
 else if(d.act==="logout"){DB.session=null;save();view="boutique";render();toast("Vous êtes déconnecté·e")}
 else if(d.act==="saveAdr"){me().adresse=document.getElementById("iAdr").value.trim();save();toast("Adresse enregistrée")}
 else if(d.act==="checkout"){
  if(!me()){layer=null;view="compte";err="Connectez-vous pour finaliser la commande.";render();return}
  const mode=document.getElementById("mode").value;
  if(mode==="Colissimo"&&!me().adresse){err="Ajoutez une adresse de livraison dans votre compte, ou choisissez le retrait à l'atelier.";renderLayer();return}
  const port=mode==="Colissimo"&&cartTotal()<60?6.9:0;
  const n=String(DB.orders.length+1).padStart(4,"0");
  const o={id:"CMD-"+n,user:me().id,date:new Date().toISOString().slice(0,10),items:DB.cart.map(l=>({id:l.id,q:l.q,prix:P(l.id).prix})),mode,port,statut:"nouvelle"};
  o.items.forEach(i=>{P(i.id).stock-=i.q});
  DB.orders.push(o);DB.cart=[];save();layer=null;view="compte";render();toast(`Commande ${o.id} enregistrée`);
 }
});
document.addEventListener("change",e=>{
 if(e.target.id==="mode"){const ship=e.target.value==="Colissimo"&&cartTotal()<60?6.9:0;document.getElementById("tot").textContent=eur(cartTotal()+ship)}
 if(e.target.dataset.statut){const o=DB.orders.find(x=>x.id===e.target.dataset.statut);if(e.target.value==="annulee"&&o.statut!=="annulee")o.items.forEach(i=>{const p=P(i.id);if(p)p.stock+=i.q});o.statut=e.target.value;save();render();toast(`${o.id} : ${STAT[o.statut]}`)}
});
document.addEventListener("input",e=>{if(e.target.id==="search"){q=e.target.value;const pos=e.target.selectionStart;render();const s=document.getElementById("search");s.focus();s.setSelectionRange(pos,pos)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&layer){layer=null;editing=null;renderLayer()}});
document.addEventListener("submit",async e=>{
 e.preventDefault();const f=e.target;
 if(f.id==="fLogin"){const em=f.querySelector("#lEmail").value.trim().toLowerCase();const h=await hash(f.querySelector("#lPwd").value);const u=DB.users.find(x=>x.email.toLowerCase()===em&&x.pwd===h);
  if(!u){err="E-mail ou mot de passe incorrect. Vérifiez la saisie ou créez un compte.";render();return}
  DB.session=u.id;err="";save();view=u.role==="admin"?"atelier":(DB.cart.length?"boutique":"compte");render();if(u.role!=="admin"&&DB.cart.length){layer="cart";renderLayer()}toast(`Bienvenue ${u.nom}`)}
 if(f.id==="fReg"){const em=f.querySelector("#rEmail").value.trim().toLowerCase();if(DB.users.some(x=>x.email.toLowerCase()===em)){err="Un compte existe déjà avec cet e-mail. Connectez-vous à gauche.";render();return}
  const u={id:uid(),nom:f.querySelector("#rNom").value.trim(),email:em,pwd:await hash(f.querySelector("#rPwd").value),role:"client",adresse:f.querySelector("#rAdr").value.trim()};
  DB.users.push(u);DB.session=u.id;err="";save();view="compte";render();toast("Compte créé, bienvenue !")}
 if(f.id==="fProd"){const g=id=>f.querySelector(id).value;
  const p=Object.assign(editing,{nom:g("#eNom").trim(),cat:g("#eCat"),parfum:g("#eParfum").trim(),cire:g("#eCire"),prix:+g("#ePrix"),stock:+g("#eStock")||0,poids:+g("#ePoids")||0,duree:+g("#eDuree")||0,desc:g("#eDesc").trim()});
  const file=f.querySelector("#ePhoto").files[0];
  const finish=()=>{if(!p.id){p.id=uid();DB.products.unshift(p)}else{const i=DB.products.findIndex(x=>x.id===p.id);DB.products[i]=p}save();layer=null;editing=null;render();toast("Création enregistrée")};
  if(file){const img=new Image();const r=new FileReader();r.onload=()=>{img.onload=()=>{const c=document.createElement("canvas");const s=600/Math.max(img.width,img.height);c.width=img.width*Math.min(1,s);c.height=img.height*Math.min(1,s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);p.photo=c.toDataURL("image/jpeg",.8);finish()};img.src=r.result};r.readAsDataURL(file)}else finish();
 }
});
init();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
